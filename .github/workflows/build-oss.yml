name: Build Orange Cloud OSS (Full Pro) APK

# 在 GitHub runners 上直接打包，不在本地构建。
# 构建 Android 子项目 apps/android 的 oss 产品风味：IS_OSS=true，零成本解锁全部 Pro 功能
# （AGPL-3.0 + Commons Clause 明示允许的自编译自用方式，非破解）。
#
# 触发：
#   - 推送到 main 分支（自动出包）
#   - 手动在 Actions 页点 Run workflow
#   - 推送 v* 标签时，除了出包还会自动发布一个 GitHub Release
#
# 签名（可选但推荐）：在仓库 Settings -> Secrets and variables -> Actions 中配置：
#   SIGNING_KEYSTORE_BASE64 : 你本地 keystore 文件的 base64（单行）
#   KEYSTORE_PASSWORD       : keystore 口令
#   KEY_ALIAS               : 别名
#   KEY_PASSWORD            : 密钥口令（若与 keystore 口令相同则填一样）
# 配了签名 -> 产出已签名的 oss release 包；未配 -> 自动退回 oss debug 包（debug 签名、同样全 Pro、可安装）。

on:
  workflow_dispatch:
  push:
    branches: [main]
  tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build oss APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode signing keystore (only if provided)
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/orangecloud.keystore"

      - name: Write keystore.properties (only if provided)
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/orangecloud.keystore" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > apps/android/keystore.properties

      - name: Determine build task
        id: buildtask
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "task=assembleOssRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleOssDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (no local daemon)
        working-directory: apps/android
        run: ./gradlew :app:${{ steps.buildtask.outputs.task }} --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-apk
          path: apps/android/app/build/outputs/apk/oss/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/oss/**/*.apk
