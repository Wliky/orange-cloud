name: Build Orange Cloud OSS (Full Pro) APK

# 在 GitHub runners 上直接打包，不在本地构建。
# 构建 Android 子项目 apps/android 的 oss 产品风味：IS_OSS=true，零成本解锁全部 Pro 功能
# （AGPL-3.0 + Commons Clause 明示允许的自编译自用方式，非破解）。
#
# 触发：
#   - 推送到 main 分支（自动出包）
#   - 手动在 Actions 页点 Run workflow
#   - 推送 v* 标签时，除了出包还会自动发布一个 GitHub Release
#
# 去重：GitHub 把“推 commit 到 main”与“推 v* 标签”视为两个独立 push 事件。
# 同一提交既推 main 又打标签时会并行跑两次构建，内容完全一样。
# 这里让分支那次在检测到“该提交已有标签”时主动跳过，由标签那次负责出包 + 发 Release；
# main 的单独推送（含上游自动同步 merge）仍会正常构建。
#
# 签名（可选但推荐）：在仓库 Settings -> Secrets and variables -> Actions 中配置：
#   SIGNING_KEYSTORE_BASE64 : 你本地 keystore 文件的 base64（单行）
#   KEYSTORE_PASSWORD       : keystore 口令
#   KEY_ALIAS               : 别名
#   KEY_PASSWORD            : 密钥口令（若与 keystore 口令相同则填一样）
# 配了签名 -> 产出已签名的 oss release 包；未配 -> 自动退回 oss debug 包（debug 签名、同样全 Pro、可安装）。
#
# 登录（可选但建议）：oss 风味默认不带官方 OAuth Client，需自建 Cloudflare OAuth App + 回调中转
# （见仓库 apps/web/README.md 与 CONTRIBUTING.md）。
#   - Client ID 配到仓库 Secrets 的 OAUTH_CLIENT_ID，工作流会把它烤进构建。
#   - 回调地址配到仓库 Variables 的 OAUTH_REDIRECT_URI（如 https://orange.005201.xyz/oauth/callback），
#     由 BuildConfig 注入，不写死在源码里，上游同步不会覆盖。
# 两者都不配也能编译且 Pro 已解锁，但 app 无法登录 Cloudflare 账号。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build oss APK
    # 固定 24.04：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免 SDK 环境突变
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 需要全部 tag（含指向历史提交的），否则下面的去重判断拿不到标签列表
          fetch-depth: 0

      # 去重守卫：分支构建时，若本提交已经带着 v* 标签，就不再重复构建。
      # 标签事件（ref_type=tag）永远不跳过 —— 出包与发 Release 由它负责。
      - name: Skip duplicate build when this commit is already tagged
        id: guard
        run: |
          if [ "${{ github.ref_type }}" = "branch" ] && [ -n "$(git tag --points-at "$GITHUB_SHA")" ]; then
            TAGS=$(git tag --points-at "$GITHUB_SHA" | tr '\n' ' ')
            echo "::notice::提交 $GITHUB_SHA 已带标签（$TAGS），跳过 main 分支的重复构建；由标签触发的那次运行负责出包与发布 Release。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 必须用 JetBrains Runtime 21：apps/android/gradle/gradle-daemon-jvm.properties
      # 里声明了 Daemon JVM 条件 toolchainVendor=jetbrains + toolchainVersion=21，
      # 而该文件不含下载 URL（toolchainUrl.*），Gradle 无法自动下载（会报
      # "No defined toolchain download url for LINUX on x86_64"）。
      # 因此这里直接提供匹配的 JBR 21，让自动探测即可命中条件。
      - name: Set up JDK 21 (JetBrains Runtime, matches daemon JVM criteria)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Register JBR 21 path for Gradle toolchain detection
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version 2>&1

      - name: Setup Android SDK
        if: steps.guard.outputs.skip != 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: steps.guard.outputs.skip != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 签名密钥经 Secrets 注入，绝不明文落库。有密钥 -> 写 keystore.properties 走 release 签名；
      # 无密钥 -> 标记未签名，后面退回 oss debug 包。
      - name: Prepare signing (if keystore provided)
        if: steps.guard.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > apps/android/keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/apps/android/keystore.jks" \
              "$KEYSTORE_PASSWORD" \
              "$KEY_ALIAS" \
              "$KEY_PASSWORD" > apps/android/keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Determine build task
        if: steps.guard.outputs.skip != 'true'
        id: buildtask
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "task=assembleOssRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleOssDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (no local daemon)
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI }}
        run: |
          EXTRA=""
          if [ -n "$OAUTH_CLIENT_ID" ]; then
            EXTRA="$EXTRA -POAUTH_CLIENT_ID=$OAUTH_CLIENT_ID"
          fi
          if [ -n "$OAUTH_REDIRECT_URI" ]; then
            EXTRA="$EXTRA -POAUTH_REDIRECT_URI=$OAUTH_REDIRECT_URI"
          fi
          ./gradlew :app:${{ steps.buildtask.outputs.task }} $EXTRA --no-daemon

      # 构建后立刻校验签名并打印签名证书指纹，便于确认用的就是自己的 keystore。
      - name: Verify APK signature (print signer certs)
        if: steps.guard.outputs.skip != 'true'
        run: |
          APK=$(ls apps/android/app/build/outputs/apk/oss/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
            "$BT/apksigner" verify --print-certs -v "$APK" || exit 1
          else
            echo "未产出 release APK（走的是 debug 兜底），跳过签名校验。"
          fi

      # 用构建出的 APK 反查 versionName（已含 oss 风味后缀），保证发布命名与 App 实际版本一致。
      # 不硬编码版本号：build.gradle.kts 中 versionName=2.1.3 + oss 风味 versionNameSuffix=-oss
      # => APK 实际版本 2.1.3-oss，产物命名即为 orange-cloud-2.1.3-oss.apk。
      - name: Resolve app version from built APK
        if: steps.guard.outputs.skip != 'true'
        id: ver
        run: |
          APK=$(find apps/android/app/build/outputs/apk/oss -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          AAPT="$BT/aapt"
          [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)
          [ -n "$VERSION" ] || VERSION="unknown"
          mkdir -p dist
          OUT="orange-cloud-${VERSION}.apk"
          cp "$APK" "dist/$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK 实际版本：$VERSION  ->  dist/$OUT"
          ls -l dist

      - name: Upload APK artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: orange-cloud-oss-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      # 仅在 tag 事件下发布；分支事件被守卫跳过后不会走到这里
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Orange Cloud OSS ${{ steps.ver.outputs.version }}
          files: dist/*.apk
