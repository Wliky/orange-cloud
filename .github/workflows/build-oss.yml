name: Build Orange Cloud OSS (Full Pro) APK

# 在 GitHub runners 上直接打包，不在本地构建。
# 构建 Android 子项目 apps/android 的 oss 产品风味：IS_OSS=true，零成本解锁全部 Pro 功能
# （AGPL-3.0 + Commons Clause 明示允许的自编译自用方式，非破解）。
#
# 触发：
#   - 推送到 main 分支（自动出包）
#   - 手动在 Actions 页点 Run workflow
#   - 推送 v* 标签时，除了出包还会自动发布一个 GitHub Release
#
# 签名（可选但推荐）：在仓库 Settings -> Secrets and variables -> Actions 中配置：
#   SIGNING_KEYSTORE_BASE64 : 你本地 keystore 文件的 base64（单行）
#   KEYSTORE_PASSWORD       : keystore 口令
#   KEY_ALIAS               : 别名
#   KEY_PASSWORD            : 密钥口令（若与 keystore 口令相同则填一样）
# 配了签名 -> 产出已签名的 oss release 包；未配 -> 自动退回 oss debug 包（debug 签名、同样全 Pro、可安装）。
#
# 登录（可选但建议）：oss 风味默认不带官方 OAuth Client，需自建 Cloudflare OAuth App + 回调中转
# （见仓库 apps/web/README.md 与 CONTRIBUTING.md）。
#   - Client ID 配到仓库 Secrets 的 OAUTH_CLIENT_ID，工作流会把它烤进构建。
#   - 回调地址配到仓库 Variables 的 OAUTH_REDIRECT_URI（如 https://orange.005201.xyz/oauth/callback），
#     由 BuildConfig 注入，不写死在源码里，上游同步不会覆盖。
# 两者都不配也能编译且 Pro 已解锁，但 app 无法登录 Cloudflare 账号。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build oss APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 签名密钥经 Secrets 注入，绝不明文落库。有密钥 -> 写 keystore.properties 走 release 签名；
      # 无密钥 -> 标记未签名，后面退回 oss debug 包。
      - name: Prepare signing (if keystore provided)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > apps/android/keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/apps/android/keystore.jks" \
              "$KEYSTORE_PASSWORD" \
              "$KEY_ALIAS" \
              "$KEY_PASSWORD" > apps/android/keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Determine build task
        id: buildtask
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "task=assembleOssRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleOssDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (no local daemon)
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI }}
        run: |
          EXTRA=""
          if [ -n "$OAUTH_CLIENT_ID" ]; then
            EXTRA="$EXTRA -POAUTH_CLIENT_ID=$OAUTH_CLIENT_ID"
          fi
          if [ -n "$OAUTH_REDIRECT_URI" ]; then
            EXTRA="$EXTRA -POAUTH_REDIRECT_URI=$OAUTH_REDIRECT_URI"
          fi
          ./gradlew :app:${{ steps.buildtask.outputs.task }} $EXTRA --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-apk
          path: apps/android/app/build/outputs/apk/oss/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/oss/**/*.apk
